<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GrassQuest</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0fdf4;
            color: #166534;
        }
        h1 {
            text-align: center;
            font-size: 2.5rem;
            margin-bottom: 0.5rem;
        }
        p {
            text-align: center;
            font-size: 1.1rem;
            max-width: 600px;
            line-height: 1.5;
        }
        .card {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            width: 100%;
            max-width: 400px;
            margin-top: 20px;
            box-sizing: border-box;
        }
        .status {
            display: flex;
            align-items: center;
            gap: 10px;
            font-weight: bold;
            margin-bottom: 10px;
        }
        .indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background-color: #ccc;
        }
        .indicator.loading { background-color: #eab308; }
        .indicator.ok { background-color: #22c55e; }
        .indicator.error { background-color: #ef4444; }
        #message {
            font-size: 0.95rem;
            color: #4b5563;
        }
        .form-group {
            margin-bottom: 15px;
            display: flex;
            flex-direction: column;
        }
        label {
            font-weight: bold;
            margin-bottom: 5px;
            color: #166534;
        }
        input, select {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
        }
        button {
            background-color: #166534;
            color: white;
            border: none;
            padding: 12px;
            border-radius: 6px;
            font-size: 1rem;
            cursor: pointer;
            font-weight: bold;
            width: 100%;
            margin-top: 10px;
        }
        button:disabled {
            background-color: #a3e635;
            cursor: not-allowed;
        }
        .hidden-file-input {
            display: none !important;
        }
        .task-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .task-item {
            background: #f0fdf4;
            border: 1px solid #bbf7d0;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            position: relative;
        }
        .task-item.completed {
            background: #dcfce7;
            border-color: #4ade80;
        }
        .task-title {
            font-weight: bold;
            display: block;
            margin-bottom: 5px;
        }
        .task-hint {
            font-size: 0.9rem;
            color: #15803d;
            font-style: italic;
        }
        .hidden {
            display: none !important;
        }
        .error-message {
            color: #ef4444;
            margin-top: 10px;
            font-size: 0.95rem;
            text-align: center;
        }
        .feedback {
            margin-top: 10px;
            padding: 10px;
            border-radius: 6px;
            font-size: 0.95rem;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }
        .feedback-row {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .feedback.success {
            background-color: #dcfce7;
            color: #166534;
        }
        .feedback.failure {
            background-color: #fee2e2;
            color: #991b1b;
        }
        .check-icon {
            font-weight: bold;
            font-size: 1.2rem;
        }
        .confidence-note {
            font-size: 0.8rem;
            color: #854d0e;
            font-style: italic;
            margin-left: 22px;
        }
        #quest-title {
            margin-top: 0;
            color: #14532d;
            text-align: center;
        }
        .phone-hint {
            text-align: center;
            font-style: italic;
            color: #6b7280;
            font-size: 0.9rem;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <h1>🌿 GrassQuest</h1>
    <p>A local-first app for the Hacktoberfest Touch Grass challenge.</p>
    
    <!-- Health Card -->
    <div class="card" id="health-card">
        <div class="status">
            <div id="indicator" class="indicator loading"></div>
            <span id="status-text">Checking Ollama Status...</span>
        </div>
        <div id="message">Connecting to local AI engine...</div>
    </div>

    <!-- Plan Screen (Form) -->
    <div class="card" id="plan-card">
        <h2>Plan your walk</h2>
        <div class="form-group">
            <label for="area">Where are you going?</label>
            <input type="text" id="area" placeholder="e.g. City park, neighborhood, forest" required>
        </div>
        <div class="form-group">
            <label for="season">Season</label>
            <select id="season">
                <option value="Autumn">Autumn</option>
                <option value="Winter">Winter</option>
                <option value="Spring">Spring</option>
                <option value="Summer">Summer</option>
            </select>
        </div>
        <div class="form-group">
            <label for="minutes">How long (minutes)?</label>
            <input type="number" id="minutes" min="10" max="120" value="30" required>
        </div>
        <button id="generate-btn" onclick="generateQuest()">Make my quest</button>
        <div id="form-error" class="error-message hidden"></div>
    </div>

    <!-- Active Quest Screen -->
    <div class="card hidden" id="quest-card">
        <h2 id="quest-title"></h2>
        <p class="phone-hint">Put your phone away between photos.</p>
        <ul id="task-list" class="task-list"></ul>
        <button id="new-quest-btn" onclick="clearQuest()" style="background-color: #ef4444; margin-top: 10px;">Abandon & New Quest</button>
    </div>
        <button id="copy-journal-btn" onclick="copyJournal()" style="background-color: #0ea5e9; margin-top: 20px;">Copy to clipboard 📋</button>
        <button id="back-quest-btn" onclick="backToQuest()" style="background-color: #64748b; margin-top: 10px;">Back to quest</button>
    </div>

    <script>
        let currentQuest = null;

        async function checkHealth() {
            const indicator = document.getElementById('indicator');
            const statusText = document.getElementById('status-text');
            const message = document.getElementById('message');
            const generateBtn = document.getElementById('generate-btn');

            try {
                const response = await fetch('/api/health');
                const data = await response.json();

                if (response.ok && data.status === 'ok') {
                    indicator.className = 'indicator ok';
                    statusText.textContent = 'System Ready';
                    message.textContent = data.message;
                    message.style.color = '#15803d';
                } else {
                    indicator.className = 'indicator error';
                    statusText.textContent = 'System Error';
                    message.textContent = data.message;
                    message.style.color = '#b91c1c';
                    generateBtn.disabled = true;
                }
            } catch (error) {
                indicator.className = 'indicator error';
                statusText.textContent = 'Connection Failed';
                message.textContent = 'Could not reach the server. Is it running?';
                message.style.color = '#b91c1c';
                generateBtn.disabled = true;
            }
        }

        async function generateQuest() {
            const area = document.getElementById('area').value;
            const season = document.getElementById('season').value;
            const minutes = document.getElementById('minutes').value;
            const errorDiv = document.getElementById('form-error');
            const btn = document.getElementById('generate-btn');

            errorDiv.classList.add('hidden');

            if (!area || !season || !minutes) {
                errorDiv.textContent = 'Please fill out all fields.';
                errorDiv.classList.remove('hidden');
                return;
            }

            btn.disabled = true;
            btn.textContent = 'Generating... (This may take a minute)';

            try {
                const response = await fetch('/api/quest', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ area, season, minutes })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Failed to generate quest.');
                }

                currentQuest = await response.json();
                localStorage.setItem('grassQuest', JSON.stringify(currentQuest));
                renderQuest();
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
            } finally {
                btn.disabled = false;
                btn.textContent = 'Make my quest';
            }
        }

        function renderQuest() {
            if (!currentQuest) return;

            document.getElementById('plan-card').classList.add('hidden');
            document.getElementById('quest-card').classList.remove('hidden');
            
            document.getElementById('quest-title').textContent = currentQuest.title;
            const taskList = document.getElementById('task-list');
            taskList.innerHTML = '';
            
            let completedCount = 0;

            currentQuest.tasks.forEach((task, index) => {
                const li = document.createElement('li');
                li.className = 'task-item';
                if (task.completed) {
                    li.classList.add('completed');
                    completedCount++;
                }

                let feedbackHtml = '';
                if (task.completed && task.note) {
                    const unsureNote = (task.confidence === 'low' || task.confidence === 'medium') ? `<div class="confidence-note">(Gemma is not sure)</div>` : '';
                    feedbackHtml = `
                        <div class="feedback success">
                            <div class="feedback-row">
                                <span class="check-icon">✓</span>
                                <span>${task.note}</span>
                            </div>
                            ${unsureNote}
                        </div>
                    `;
                }

                li.innerHTML = `
                    <span class="task-title">${task.text}</span>
                    ${task.hint ? `<span class="task-hint">Hint: ${task.hint}</span>` : ''}
                    ${feedbackHtml}
                    <div id="error-${index}" class="error-message hidden"></div>
                `;

                if (!task.completed) {
                    const btnWrap = document.createElement('div');
                    btnWrap.style.marginTop = '10px';
                    
                    const btnText = document.createElement('button');
                    btnText.id = `btn-text-${index}`;
                    btnText.textContent = 'Take photo 📷';

                    const fileInput = document.createElement('input');
                    fileInput.type = 'file';
                    fileInput.accept = 'image/*';
                    fileInput.capture = 'environment';
                    fileInput.className = 'hidden-file-input';
                    fileInput.onchange = (e) => handlePhotoUpload(e, index, task.text);

                    btnText.onclick = () => fileInput.click();

                    btnWrap.appendChild(btnText);
                    btnWrap.appendChild(fileInput);

                    li.appendChild(btnWrap);
                }

                taskList.appendChild(li);
            });


        }

        function clearQuest() {
            localStorage.removeItem('grassQuest');
            currentQuest = null;
            document.getElementById('quest-card').classList.add('hidden');
            document.getElementById('plan-card').classList.remove('hidden');
            document.getElementById('area').value = '';
        }

        async function handlePhotoUpload(event, taskIndex, taskText) {
            const file = event.target.files[0];
            if (!file) return;

            const errorDiv = document.getElementById(`error-${taskIndex}`);
            const btnText = document.getElementById(`btn-text-${taskIndex}`);
            
            errorDiv.classList.add('hidden');
            btnText.textContent = 'Analyzing...';
            
            try {
                const base64Image = await resizeImage(file, 1024);

                const response = await fetch('/api/check', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ taskText, imageBase64: base64Image })
                });

                if (!response.ok) {
                    const errData = await response.json();
                    throw new Error(errData.error || 'Failed to check photo.');
                }

                const checkData = await response.json();

                if (checkData.matchesTask) {
                    currentQuest.tasks[taskIndex].completed = true;
                    currentQuest.tasks[taskIndex].note = checkData.note;
                    currentQuest.tasks[taskIndex].confidence = checkData.confidence;
                    localStorage.setItem('grassQuest', JSON.stringify(currentQuest));
                    renderQuest();
                } else {
                    errorDiv.innerHTML = `<div class="feedback failure"><div class="feedback-row">Not quite! ${checkData.note} Try again.</div></div>`;
                    errorDiv.classList.remove('hidden');
                    btnText.textContent = 'Take photo 📷';
                }
            } catch (error) {
                errorDiv.textContent = error.message;
                errorDiv.classList.remove('hidden');
                btnText.textContent = 'Take photo 📷';
            }
        }

        function resizeImage(file, maxDimension) {
            return new Promise((resolve, reject) => {
                const img = new Image();
                const objectUrl = URL.createObjectURL(file);
                
                img.onload = () => {
                    URL.revokeObjectURL(objectUrl);
                    let width = img.width;
                    let height = img.height;

                    if (width > height) {
                        if (width > maxDimension) {
                            height = Math.round(height * maxDimension / width);
                            width = maxDimension;
                        }
                    } else {
                        if (height > maxDimension) {
                            width = Math.round(width * maxDimension / height);
                            height = maxDimension;
                        }
                    }

                    const canvas = document.createElement('canvas');
                    canvas.width = width;
                    canvas.height = height;

                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(img, 0, 0, width, height);

                    const dataUrl = canvas.toDataURL('image/jpeg', 0.8);
                    resolve(dataUrl);
                };
                
                img.onerror = () => {
                    URL.revokeObjectURL(objectUrl);
                    reject(new Error("This photo format isn't supported. Try a JPEG or PNG photo."));
                };
                
                img.src = objectUrl;
            });
        }

        function init() {
            checkHealth();
            const savedQuest = localStorage.getItem('grassQuest');
            if (savedQuest) {
                try {
                    currentQuest = JSON.parse(savedQuest);
                    renderQuest();
                } catch (e) {
                    localStorage.removeItem('grassQuest');
                }
            }
        }

        init();
    </script>
</body>
</html>
